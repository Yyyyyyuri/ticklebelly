*{box-sizing:border-box}body{margin:0;background:#f5f7ef;color:#293c31;font-family:system-ui,"Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}header{max-width:1200px;margin:auto;padding:28px 36px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #dbe3d3}.brand{font-weight:850;font-size:22px}.brand span{color:#527744}small,.muted{color:#75816f}main{max-width:1130px;margin:52px auto;padding:0 24px}.intro{display:flex;align-items:end;justify-content:space-between;margin-bottom:30px}.eyebrow{font-size:12px;letter-spacing:3px;color:#6b855d}h1{font-size:48px;margin:12px 0;letter-spacing:-2px}p{line-height:1.7}.layout{display:grid;grid-template-columns:1fr 340px;gap:28px}.panel{background:#fefff9;border:1px solid #dce4d4;border-radius:22px;padding:26px}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h2{font-size:19px;margin:0}.btn{border:1px solid #cbd8c1;background:transparent;color:#405c38;padding:10px 15px;border-radius:10px}.btn:hover{background:#eaf1e1}.primary{background:#365c3e;color:white;border:0}.primary:hover{background:#284a30}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{text-align:left;color:inherit;min-height:70px;border:1px solid #dce4d4;border-radius:14px;padding:17px;position:relative;background:white}.card.selected{border-color:#79986a;background:#edf4e5}.card.winner{box-shadow:0 0 0 3px #9eb97c}.card label{display:flex;gap:11px;cursor:pointer;align-items:center}.emoji{font-size:27px}.name{font-size:16px;font-weight:700;overflow-wrap:anywhere}.category{font-size:12px;color:#87917f;margin-top:5px}input[type=checkbox]{accent-color:#496d42;width:17px;height:17px}.actions{margin-top:16px;display:flex;gap:15px;justify-content:end}.textbtn{border:0;background:none;color:#748568;font-size:12px;padding:3px}.textbtn:hover{color:#365c3e}.aside{background:#e1ebd3;text-align:center;display:flex;flex-direction:column;align-items:center;min-height:430px}.dish{width:140px;height:140px;background:#f8fbf1;border-radius:50%;display:grid;place-items:center;font-size:65px;margin:25px 0;box-shadow:0 0 0 13px #f5fae977}.result{font-size:26px;font-weight:800;margin:8px 0;overflow-wrap:anywhere;max-width:100%}.pick{width:100%;padding:16px;margin-top:22px;font-weight:700}.aside small{font-size:12px;margin-top:14px}.foot{font-size:12px;display:flex;justify-content:space-between;margin-top:22px;color:#78866e}.toast:empty{display:none}.toast{font-size:13px;color:#607a51;margin-top:16px}dialog{border:1px solid #cbd8c1;border-radius:22px;padding:30px;width:min(430px,92vw);color:#293c31}dialog::backdrop{background:#293c3166}dialog input{width:100%;padding:12px;border-radius:9px;border:1px solid #d9ddd2;margin:8px 0 20px}dialog label{font-size:14px}.dialogactions{display:flex;justify-content:end;gap:10px}.empty{padding:45px 10px;color:#88907f;grid-column:1/-1;text-align:center}button:disabled{opacity:.5;cursor:default}:focus-visible{outline:3px solid #7b9f5f;outline-offset:3px}@media(max-width:800px){main{margin-top:30px}.layout{grid-template-columns:1fr}.aside{min-height:330px;grid-row:1}.dish{width:90px;height:90px;font-size:44px;margin:10px}.intro{display:block}h1{font-size:36px}.cards{grid-template-columns:1fr 1fr}header{padding:22px}.panel{padding:20px}}@media(prefers-reduced-motion:no-preference){.rolling .dish{animation:bounce .25s infinite alternate}@keyframes bounce{to{transform:rotate(12deg) scale(1.05)}}}.panel{box-shadow:0 8px 26px #365c3e08}.card{transition:background .15s,border-color .15s}.card:hover{border-color:#648c51}.dish{border-radius:45% 55% 52% 48%}.brand{letter-spacing:1px}@media(max-width:480px){h1{font-size:30px;letter-spacing:-1px}.toolbar{gap:10px;flex-wrap:wrap}}.selection-control{display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:320px}.selection-control small{font-size:12px;line-height:1.6;text-align:right}.selection-control .btn{background:#edf4e5;font-weight:600;border-color:#9fb68e}.selection-control .btn:hover{background:#dfead3}.list-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}.list-heading h2{margin-bottom:4px}.list-heading #count{font-size:12px}.list-heading .btn{padding:8px 13px;font-size:13px;font-weight:600;background:#edf4e5;border-color:#9fb68e;flex-shrink:0}.list-heading .btn:hover{background:#dfead3}.selection-help{display:block;font-size:12px;line-height:1.5;margin-bottom:14px;color:#75816f}.dish svg{display:block;overflow:visible}.tickle-hand{transform-origin:49px 100px}@media(prefers-reduced-motion:no-preference){.rolling .dish{animation:none}.rolling .tickle-hand{animation:tickle .18s ease-in-out infinite alternate}.rolling .tickle-lines{animation:tickleSpark .3s ease-in-out infinite alternate}@keyframes tickle{from{transform:translate(-2px,2px) rotate(-7deg)}to{transform:translate(4px,-2px) rotate(6deg)}}@keyframes tickleSpark{from{opacity:.25}to{opacity:1}}}.aside{display:flex;flex-direction:column;justify-content:center;align-items:stretch;min-height:300px;text-align:left}.aside-summary{display:grid;grid-template-columns:112px minmax(0,1fr);align-items:center;gap:18px;width:100%}.aside .dish{width:112px;height:112px;margin:12px 0;box-shadow:none}.aside .dish svg{width:112px;height:112px}.aside-copy{min-width:0}.aside-copy #caption{display:block;margin:0;line-height:1.6}.aside-copy .result{font-size:22px;line-height:1.45;margin:8px 0 0}.aside .pick{margin-top:24px}.aside #hint{text-align:center;margin-top:12px}.aside #hint:empty{display:none}@media(max-width:800px){.aside{min-height:240px}.aside-summary{grid-template-columns:112px minmax(0,1fr);max-width:420px;margin:auto}.aside .dish{width:112px;height:112px}.aside-copy .result{font-size:24px}}</style></head><body>
<main><section class="intro"><div><h1>〰 挠挠<span style="color:#527744">胃袋</span></h1></div></section><div class="layout"><section class="panel"><div class="list-heading"><div><h2>我的餐馆 <small id="count"></small></h2></div><button class="btn" id="toggle" aria-describedby="toggleHelp">取消全选</button></div><small id="toggleHelp" class="selection-help">仅选中的餐馆参与抽选，支持一键全选或取消。</small><div class="cards" id="cards"></div><div class="toast" id="toast" role="status"></div><div class="foot"><span>点击卡片选择参与抽选的餐馆</span><span>每家餐馆，机会均等</span></div></section><aside class="panel aside" id="aside"><div class="aside-summary"><div class="dish" id="dish"><svg viewBox="0 0 160 160" width="140" height="140" role="img" aria-label="小手挠胃袋"><path d="M76 22v31c0 10-15 10-20 23-9 23 2 49 27 52 28 4 49-16 48-42-1-21-13-34-27-30-9 3-9 15-16 12-5-2-2-12-2-18V22" fill="#dcebbf" stroke="#365c3e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M66 117c-11 3-13 11-13 19" fill="none" stroke="#365c3e" stroke-width="3.5" stroke-linecap="round"/><circle cx="91" cy="87" r="3" fill="#365c3e"/><circle cx="111" cy="87" r="3" fill="#365c3e"/><path d="M95 99q7 7 13-1" fill="none" stroke="#365c3e" stroke-width="3" stroke-linecap="round"/><g class="tickle-hand" stroke="#365c3e" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="m43 116-13-13-14-12q-4-4-1-7 3-3 7 0l10 7-12-29q-2-5 2-7 4-2 6 3l12 24-6-36q-1-5 3-6 5-1 6 4l7 35 1-37q0-5 5-5 4 0 4 5l1 38 7-27q1-5 6-4 4 1 3 6l-7 38q-2 17-16 25" fill="#fff4dd"/><path d="m38 96 4 9m7-13 3 10m8-10-1 9" fill="none" stroke="#bdac86" stroke-width="2"/></g><g class="tickle-lines" stroke="#7f9e63" stroke-width="3" stroke-linecap="round"><path d="m119 43 5-7m4 15 8-2"/></g></svg></div><div class="aside-copy"><small id="caption">胃袋准备好接收惊喜了吗？</small><div class="result" id="result" aria-live="polite">今天，宠幸哪一家？</div></div></div><button class="btn primary pick" id="pick">挠一下</button><small id="hint">点击餐馆卡片选择，再随机选出一家</small></aside></div></main>
<script>
const $=s=>document.getElementById(s);let items=[],busy=false,loading=true,winner=null;
async function loadRestaurants(){loading=true;render();$('toast').textContent='正在读取餐馆清单…';try{const response=await fetch('./restaurants.json',{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const names=await response.json();if(!Array.isArray(names)||!names.every(n=>typeof n==='string'&&n.trim()))throw new Error('名单格式错误');items=names.map((name,i)=>({id:'json-'+i,name:name.trim(),selected:true}));$('toast').textContent='';}catch(error){items=[];$('toast').textContent=location.protocol==='file:'?'请通过本地预览网址打开，以便加载餐馆名单。':'无法读取餐馆名单，请刷新重试。';}finally{loading=false;render()}}
function save(){}
function render(){ $('cards').replaceChildren();items.forEach(item=>{const card=document.createElement('button');card.type='button';card.className='card name'+(item.selected?' selected':'')+(winner===item.id?' winner':'');card.textContent=item.name;card.setAttribute('aria-pressed',String(item.selected));card.disabled=busy||loading;card.onclick=()=>{item.selected=!item.selected;save();render()};$('cards').append(card)});if(!items.length){const p=document.createElement('div');p.className='empty';p.textContent=loading?'正在加载…':'清单还是空的，请在 restaurants.json 中设置餐馆名单。';$('cards').append(p)}const n=items.filter(x=>x.selected).length;$('count').textContent=`/ ${n} 家参与抽选`;$('pick').disabled=!n||busy||loading;$('pick').textContent=busy?'胃袋挑选中…':n?'挠一下':'先选择一家餐馆';$('toggle').disabled=busy||loading||!items.length;$('toggle').textContent=items.length&&items.every(x=>x.selected)?'取消全选':'全选'}
$('toggle').onclick=()=>{const all=items.every(x=>x.selected);items.forEach(x=>x.selected=!all);render()};
function randomIndex(n){const a=new Uint32Array(1),limit=4294967296-(4294967296%n);do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%n}
$('pick').onclick=()=>{if(busy)return;const pool=items.filter(x=>x.selected);if(!pool.length)return;busy=true;winner=null;render();$('aside').classList.add('rolling');$('caption').textContent='挠挠挠…胃袋正在挑选！';let step=0;const timer=setInterval(()=>{const x=pool[step++%pool.length];$('result').textContent=x.name;if(step>=12){clearInterval(timer);const chosen=pool[randomIndex(pool.length)];winner=chosen.id;$('result').textContent=chosen.name;$('caption').textContent='胃袋说：就是这家！';$('hint').textContent='';busy=false;$('aside').classList.remove('rolling');render()}},85)};loadRestaurants();
</script></body></html>
